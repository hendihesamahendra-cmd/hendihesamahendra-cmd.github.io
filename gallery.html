<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Coretan Tangan — HENDI HESA MAHENDRA</title>

  <meta
    name="description"
    content="Kumpulan sketsa, lukisan, dan kaligrafi."
  />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&display=swap"
    rel="stylesheet"
  />

  <style>
    :root {
      --black: #07090b;
      --paper: #111417;
      --white: #f4f4f0;
      --ink: #eeeeea;
      --muted: #858b91;
      --line: rgba(244, 244, 240, 0.12);
      --blue: #3d8fe8;
      --blue-light: #82c1ff;
      --blue-faint: rgba(61, 143, 232, 0.09);
      --paper-white: #f5f3ed;
      --max: 1380px;
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      background: linear-gradient(135deg, #ffb37a 0%, #ff9a8f 50%, #ff9eb5 100%);
      background-attachment: fixed;
      color: var(--ink);
      font-family: Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    img { max-width: 100%; }

    a { color: inherit; text-decoration: none; }

    /* HEADER — sama seperti index.html */
    .site-header {
      position: relative;
      z-index: 20;
      width: 100%;
      height: 82px;
      padding: 0 5vw;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: white;
      background: var(--black);
    }

    .site-name {
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      opacity: 0.9;
    }

    .nav { display: flex; align-items: center; gap: 38px; }

    .nav a {
      font-size: 9px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      opacity: 0.72;
      transition: opacity 0.3s ease, color 0.3s ease;
    }

    .nav a:hover { opacity: 1; color: white; }

    /* PAGE HEADER */
    .gallery-hero {
      padding: 90px 0 40px;
      background: var(--black);
      color: white;
      text-align: center;
    }

    .gallery-label {
      display: inline-flex;
      align-items: center;
      gap: 14px;
      font-size: 8px;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--blue-light);
    }

    .gallery-title {
      margin: 22px auto 0;
      max-width: 720px;
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: clamp(38px, 6vw, 64px);
      font-weight: 500;
      line-height: 1.05;
      letter-spacing: -0.02em;
      text-transform: uppercase;
    }

    /* GRID */
    main { background: transparent; }

    .section {
      width: min(var(--max), 90vw);
      margin: 0 auto;
    }

    .gallery-grid {
      padding: 70px 0 130px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 46px;
    }

    .artwork-card {
      background: var(--paper-white);
      padding: 16px 16px 22px;
      box-shadow: 0 18px 34px rgba(0,0,0,0.4);
      transform: rotate(-0.4deg);
      transition: transform 0.45s ease, box-shadow 0.45s ease;
    }

    .artwork-card:nth-child(even) {
      transform: rotate(0.5deg);
    }

    .artwork-card:hover {
      transform: rotate(0deg) translateY(-6px);
      box-shadow: 0 26px 42px rgba(0,0,0,0.48);
    }

    .artwork-photo {
      overflow: hidden;
      background: #ddd8ce;
    }

    .artwork-photo img {
      display: block;
      width: 100%;
      height: auto;
      filter: saturate(0.75) contrast(1.05);
      transition: transform 0.7s ease;
    }

    .artwork-card:hover .artwork-photo img {
      transform: scale(1.03);
    }

    /* EMPTY STATE untuk slot yang belum diisi */
    .artwork-card.is-empty {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 220px;
      background: transparent;
      border: 1px dashed rgba(0, 0, 0, 0.22);
      box-shadow: none;
      transform: none;
    }

    .artwork-card.is-empty:hover {
      transform: none;
      box-shadow: none;
    }

    .artwork-card.is-empty span {
      font-family: "Courier New", monospace;
      font-size: 9px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: rgba(50, 25, 20, 0.55);
    }

    footer {
      background: #0a0d10;
      color: white;
      padding: 43px 5vw 39px;
      text-align: center;
      font-family: "Courier New", monospace;
      font-size: 8px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.42);
    }

    footer a { color: var(--blue-light); }

    @media (max-width: 850px) {
      .site-header { height: 65px; padding: 0 22px; }
      .site-name { font-size: 7px; }
      .nav { gap: 19px; }
      .nav a { font-size: 7px; letter-spacing: 0.16em; }
      .gallery-hero { padding: 60px 0 32px; }
      .section { width: calc(100% - 44px); }
      .gallery-grid { padding: 50px 0 90px; gap: 30px; }
    }
  </style>
</head>
<body>

  <header class="site-header">
    <a href="index.html" class="site-name">HENDI HESA MAHENDRA</a>
    <nav class="nav">
      <a href="index.html#works">Works</a>
      <a href="index.html#about">About</a>
      <a href="index.html#map">Map</a>
      <a href="gallery.html" style="opacity:1;color:white;">Gallery</a>
    </nav>
  </header>

  <section class="gallery-hero">
    <div class="gallery-label">Personal Archive</div>
    <h1 class="gallery-title">Coretan Tangan</h1>
  </section>

  <main>
    <div class="section">
      <div class="gallery-grid">

        <!-- KARYA 01 -->
        <div class="artwork-card">
          <div class="artwork-photo">
            <img
              src="sketsa-pantai-berdua.jpg"
              alt="Sketsa hitam putih dua orang duduk berdua di pantai"
            />
          </div>
        </div>

        <!-- SLOT KOSONG — ganti dengan karya berikutnya -->
        <div class="artwork-card is-empty">
          <span>Karya berikutnya menyusul</span>
        </div>

      </div>
    </div>
  </main>

  <footer>
    © HENDI HESA MAHENDRA · <a href="index.html">Kembali ke Archive</a>
  </footer>

</body>
</html>
